<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Learn</title>
<meta name="theme-color" content="#0d0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Learn">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#0d0e10;--panel:#14161a;--panel2:#1b1e23;--line:#26282d;--fg:#ebe9e4;--mute:#8d9099;--ok:#5fcf9a;--bad:#ef6b6b;--warn:#e2b04a;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);overscroll-behavior:none;-webkit-text-size-adjust:100%}
h1{font-size:26px;margin:0;font-weight:600;letter-spacing:-.01em}h2{font-size:21px;margin:0 0 8px;font-weight:600;letter-spacing:-.01em}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column}
/* modes: map (full screen canvas), today and settings (list pages with header and tab bar), sub (lessons and quizzes, no bars) */
body.m-map #app{display:none}
body:not(.m-map) #map,body:not(.m-map) #fit,body:not(.m-map) #hint{display:none}
body.m-sub #hdr,body.m-sub #tabs{display:none}
body.m-today #app,body.m-settings #app{padding-top:calc(env(safe-area-inset-top) + 84px);padding-bottom:calc(env(safe-area-inset-bottom) + 86px)}
body.m-map{position:fixed;inset:0;overflow:hidden}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#map.drag{cursor:grabbing}
/* header */
#hdr{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--bg) 60%,rgba(13,14,16,0));pointer-events:none}
#hdr>*{pointer-events:auto}
.word{font-weight:600;font-size:28px;letter-spacing:-.02em}
.stats{display:flex;align-items:center;gap:8px}
.chip{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;background:var(--panel);white-space:nowrap}
.lvl{display:flex;flex-direction:column;gap:5px;min-width:64px}
.lvl b{font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.lvl i{display:block;height:3px;background:var(--line)}
.lvl u{display:block;height:100%;background:var(--fg);text-decoration:none}
.gear{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;width:36px;height:34px;display:grid;place-items:center;cursor:pointer;padding:0}
/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-top:1px solid var(--line);
  padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
.tab{background:none;border:0;color:var(--mute);font:500 12px var(--sans);letter-spacing:.03em;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.tab[aria-current=page]{color:var(--fg);box-shadow:inset 0 2px 0 var(--fg)}
#fit{position:fixed;z-index:4;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 66px);width:38px;height:38px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
#hint{position:fixed;z-index:4;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);transform:translateX(-50%);font-size:13px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 11px;white-space:nowrap;transition:opacity .5s;pointer-events:none}
#hint.gone{opacity:0}
#sheet{position:fixed;z-index:6;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 64px);max-width:460px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px}
#sheet h2{margin:0;font-size:20px}
#sheet .g{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px;margin:3px 0 10px}
#sheet .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
#sheet .rows{display:flex;gap:22px;font-size:14px;font-variant-numeric:tabular-nums}
#sheet .rows span{color:var(--mute);display:block;font-size:12px}
#sheet .abt{color:#b9b7b2;font-size:13px;line-height:1.4;margin:-2px 0 10px}#sheet .abt:empty{display:none}
#sheet .rel{color:var(--mute);font-size:13px;line-height:1.4;margin:-4px 0 12px}
#sheet .pb{height:3px;background:var(--line);margin:12px 0 14px}#sheet .pb i{display:block;height:100%}
#sheet .x{position:absolute;right:8px;top:8px;border:0;background:none;color:var(--mute);width:30px;height:30px;font-size:20px;cursor:pointer}
/* shared controls */
.sub{color:var(--mute);font-size:14px;margin:2px 0 14px}
.sec{color:var(--mute);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.sec i{width:9px;height:9px;border-radius:50%;display:inline-block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:10px}
.deck{display:block;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;padding:13px 14px;position:relative;overflow:hidden}
.deck:active{background:var(--panel2)}
.deck b{display:block;font-size:16px;font-weight:600}.deck small{color:var(--mute);font-size:13px}
.deck::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gc,var(--fg))}
.prog{border:1px solid var(--line);background:var(--panel);padding:14px;margin-bottom:14px}.prog .pr{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}.prog .pr b{font-size:16px;font-weight:600}.prog .pr span{color:var(--mute,#999);font-variant-numeric:tabular-nums}
.xpn{white-space:nowrap}.lvup{margin-top:18px;display:inline-block;border:1px solid var(--fg);padding:8px 18px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;animation:lvin .6s ease-out}@keyframes lvin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{height:3px;background:var(--line);margin-top:9px}
.bar i{display:block;height:100%;background:var(--gc,var(--fg));transition:width .3s}
.btn{display:block;width:100%;border:1px solid var(--fg);border-radius:8px;padding:14px;font:inherit;font-size:16px;font-weight:600;color:var(--bg);background:var(--fg);cursor:pointer;margin-top:10px}
.btn.ghost{background:var(--panel);color:var(--fg);border-color:var(--line)}
.btn.sm{padding:10px;font-size:14px}
.btn:disabled{opacity:.35}
.btn.done{background:var(--panel);color:var(--ok);border-color:rgba(95,207,154,.4)}
.btn .ck{margin-left:7px;vertical-align:-1px}
.card.lessondone{border-left:3px solid var(--ok)}
.card.lessondone>b{color:#9fb8ab}
.sub.okc{color:var(--ok)}
.btn:active{filter:brightness(.88)}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:10px}
.hero h2{margin:0}.hero p{margin:4px 0 0;color:var(--mute);font-size:14px}
.back{background:none;border:0;color:var(--mute);font:inherit;font-size:16px;padding:6px 0;cursor:pointer;text-align:left}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.about{margin:-6px 0 18px}.about p{margin:0 0 7px;color:var(--mute);font-size:14.5px;line-height:1.45}.about p:first-child{color:#c9c7c2}
.read{font-size:18px;line-height:1.55}
.read b{color:#fff}.read .tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;margin-bottom:6px}
.read ul{padding-left:20px}.read li{margin:6px 0}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:15px;font:inherit;font-size:17px;margin-top:10px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:rgba(95,207,154,.12)}
.opt.bad{border-color:var(--bad);background:rgba(239,107,107,.12)}
.why{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--panel2);font-size:15px;line-height:1.45}
.src{color:var(--mute);font-size:12px;margin-top:10px;line-height:1.5}.src a{color:var(--mute)}
.gloss{margin:2px 0 6px;padding:9px 12px;border-left:3px solid var(--warn);background:rgba(226,176,74,.08);border-radius:0;font-size:14px;line-height:1.4;color:#e9dcc0}
.gloss b{color:var(--warn)}
.lvlh{color:var(--mute);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:16px 0 6px}
.row{display:flex;gap:8px}.row .btn{margin-top:8px}
.spacer{flex:1}
.center{text-align:center}.score{font-size:64px;font-weight:600;margin:18px 0 4px;letter-spacing:-.02em}
.dots{display:flex;gap:5px;justify-content:center;margin:6px 0 16px;flex-wrap:wrap}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--fg)}
.note{color:var(--mute);font-size:13px;text-align:center;margin-top:18px}
.set{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}.set b{font-size:15px;font-weight:600}
.set .p{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.set .p button{height:40px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--fg);font:inherit;font-size:15px;cursor:pointer}
.set .p button.on{background:var(--fg);color:var(--bg);font-weight:600;border-color:var(--fg)}.set .p button.z.on{background:var(--bad);border-color:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
</head>
<body class="m-map">
<canvas id="map" tabindex="0" role="img" aria-label="Knowledge map. Drag to move, pinch or scroll to zoom. Topics are grouped into coloured territories."></canvas>
<div id="app"><div class="note">Loading…</div></div>
<header id="hdr">
  <div class="word">Learn</div>
  <div class="stats">
    <div class="lvl" id="lvl"><b>Lv 1</b><i><u style="width:0%"></u></i></div>
    <span class="chip" id="cs">🔥 0</span><span class="chip" id="cx">⭐ 0</span>
    <button class="gear" id="gear" aria-label="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>
<button id="fit" aria-label="Show the whole map"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
<div id="hint">Drag to move. Pinch or scroll to zoom. Tap a topic.</div>
<aside id="sheet" hidden>
  <button class="x" id="sx" aria-label="Close">×</button>
  <h2 id="sn"></h2>
  <div class="g"><span class="dot" id="sd"></span><span id="sg"></span></div>
  <div class="abt" id="sa"></div>
  <div class="rows"><div><span>Lessons done</span><b id="sl"></b></div><div><span>Due for review</span><b id="su"></b></div><div><span>Levels</span><b id="sv"></b></div></div>
  <div class="pb"><i id="sb"></i></div>
  <div class="rel" id="sr"></div>
  <button class="btn" id="go">Open lessons</button>
</aside>
<nav id="tabs" aria-label="Main">
  <button class="tab" data-tab="today"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Today</button>
  <button class="tab" data-tab="map" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="6" r="2"/><circle cx="14" cy="17" r="3"/><path d="M8 8l4 7M16 7l-1 7"/></svg>Map</button>
  <button class="tab" data-tab="settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
</nav>
<script>
/* ---------- STATE ---------- */
const KEY="learn.v1";
const FRESH=()=>({xp:0,streak:0,last:"",done:{},seen:{},focus:{},sr:{},learned:{},weekly:{ws:0,n:0},goal:20,bonusDeck:{},ver:2});
let S=FRESH();
let OLD=false;
try{const o=JSON.parse(localStorage.getItem(KEY)||"{}");OLD=o.ver!==2;S=Object.assign(S,o)}catch(e){}
/* ver 2 (21 Oct 2026): XP only for first-time-correct questions. Old XP was test data, so it restarts at zero once. */
if(OLD){S.xp=0;S.ver=2;S.learned={};S.bonusDeck={};S.weekly={ws:0,n:0}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const dayNum=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)};
const dstr=n=>new Date(n*864e5).toISOString().slice(0,10);
function bumpStreak(){const t=dayNum();if(S.last===dstr(t))return;S.streak=(S.last===dstr(t-1))?S.streak+1:1;S.last=dstr(t)}
const streakNow=()=>{const t=dayNum();return (S.last===dstr(t)||S.last===dstr(t-1))?S.streak:0};
const INTERVALS=[0,1,3,7,16,35];
function srDue(id){const r=S.sr[id];return !r||r.d<=dayNum()}
function srUpdate(id,ok){const r=S.sr[id]||{b:0};r.b=ok?Math.min(r.b+1,5):0;r.d=dayNum()+INTERVALS[r.b];S.sr[id]=r}
/* level from XP: level n+1 costs 50*n+50 more than level n (100, 150, 200, ...). See docs/SPEC-XP-LEVELS-AND-MAP.md */
function levelInfo(xp){let lv=1,floor=0,step=100;while(xp>=floor+step){floor+=step;lv++;step=50*lv+50}return{lv,pct:Math.round((xp-floor)/step*100),into:xp-floor,step}}
/* weekly goal: first-time-correct answers since Monday (local time) */
const weekStart=()=>{const d=dayNum();return d-((d+3)%7)};
function weekly(){if(!S.weekly||S.weekly.ws!==weekStart())S.weekly={ws:weekStart(),n:0};return S.weekly}
/* XP for one answer: only the first time a question is answered correctly */
function award(q,ok){if(!ok||!q.id||S.learned[q.id])return 0;S.learned[q.id]=1;S.xp+=10;weekly().n++;return 10}
const $=document.getElementById("app");
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const PALETTE=["#ee6a4f","#5aa2ff","#43c59e","#e2b04a","#b58cf0","#4fd0d9","#f08cb4"];
let GROUPS={};
let DECKS=[];
let tab="map";
const groupKeys=()=>Object.keys(GROUPS);

/* ---------- LOAD CONTENT ---------- */
async function load(){
  let idx;
  try{idx=await (await fetch("content/index.json",{cache:"no-store"})).json()}catch(e){$.innerHTML='<div class="note">Could not load content. Check your internet and reopen.</div>';goTab("today");return}
  const raw=idx.groups||{};
  Object.keys(raw).forEach(k=>{const v=raw[k];GROUPS[k]=typeof v==="string"?{label:v}:{label:v.label||k,color:v.color}});
  idx.decks.forEach(m=>{if(m.group&&!GROUPS[m.group])GROUPS[m.group]={label:m.group}});
  groupKeys().forEach((k,i)=>{if(!GROUPS[k].color)GROUPS[k].color=PALETTE[i%PALETTE.length]});
  const res=await Promise.all(idx.decks.map(async m=>{
    try{const d=await (await fetch("content/"+m.id+".json",{cache:"no-store"})).json();
      d.id=m.id;d.group=m.group||d.group||"base";d.deffocus=m.focus==null?3:m.focus;
      d.lessons=(d.lessons||[]).filter(l=>l.pages&&l.quiz&&l.quiz.length);
      d.lessons.forEach(l=>{l.lvl=l.lvl||1;l.quiz.forEach((q,i)=>{q.id=l.id+"#"+i})});
      d.lessons.sort((a,b)=>a.lvl-b.lvl);
      return d.lessons.length?d:null}catch(e){return null}}));
  DECKS=res.filter(Boolean);
  goTab("map");
}
const focusOf=d=>S.focus[d.id]==null?d.deffocus:S.focus[d.id];
const colorOf=d=>GROUPS[d.group].color;

/* ---------- SHELL: modes and tabs ---------- */
function show(mode){document.body.className="m-"+mode;if(mode!=="map"){sheetOff();stopMap()}}
function updateHeader(){const li=levelInfo(S.xp);document.querySelector("#lvl b").textContent="Lv "+li.lv;document.querySelector("#lvl u").style.width=li.pct+"%";
  document.getElementById("cs").textContent="🔥 "+streakNow();document.getElementById("cx").textContent="⭐ "+S.xp}
function goTab(t){tab=t;show(t);updateHeader();
  document.querySelectorAll("#tabs .tab").forEach(b=>{if(b.dataset.tab===t)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(t==="today")today();else if(t==="settings")settings();else{enterMap()}}
document.querySelectorAll("#tabs .tab").forEach(b=>b.onclick=()=>goTab(b.dataset.tab));
document.getElementById("gear").onclick=()=>goTab("settings");

/* ---------- TODAY ---------- */
function pool(){const out=[];DECKS.forEach(d=>{const f=focusOf(d);if(!f)return;d.lessons.forEach(l=>{if(S.seen[l.id])l.quiz.forEach(q=>out.push({q,f,due:srDue(q.id)}))})});return out}
function pickQuick(n){
  const p=pool(),w=x=>Math.random()/x.f;
  const due=p.filter(x=>x.due).sort((a,b)=>w(a)-w(b)),rest=p.filter(x=>!x.due).sort((a,b)=>w(a)-w(b));
  const picked=due.slice(0,n);if(picked.length<Math.min(6,p.length))picked.push(...rest.slice(0,Math.min(6,p.length)-picked.length));
  return shuffle(picked.map(x=>x.q));
}
function nextLesson(){
  const ds=DECKS.filter(d=>focusOf(d)>0).sort((a,b)=>focusOf(b)-focusOf(a));
  for(const d of ds){const l=d.lessons.find(l=>!S.done[l.id]);if(l)return {d,l}}return null;
}
function today(){
  const p=pool(),dueN=p.filter(x=>x.due).length,nx=nextLesson();
  const li=levelInfo(S.xp),wk=weekly(),goal=S.goal||20;
  let h=`<div class="prog"><div class="pr"><b>Level ${li.lv}</b><span>${li.into} / ${li.step} XP</span></div><div class="bar"><i style="width:${li.pct}%"></i></div>
    <div class="pr" style="margin-top:14px"><b>This week</b><span>${wk.n>=goal?"Goal reached: ":""}${wk.n} / ${goal} questions learned</span></div><div class="bar"><i style="width:${Math.min(100,wk.n/goal*100)}%"></i></div></div>`;
  h+=p.length?`<div class="hero"><h2>Quick quiz</h2><p>${dueN?dueN+" question"+(dueN>1?"s":"")+" due for review.":"Nothing due. Practice anyway."} About 2 minutes.</p><button class="btn" id="quick">Start</button></div>`
    :`<div class="hero"><h2>Welcome</h2><p>Read a short lesson, then get quizzed. Finish one lesson to unlock Quick quiz.</p></div>`;
  if(nx)h+=`<div class="hero"><h2>Next lesson</h2><p>${nx.d.title}: ${nx.l.title}</p><button class="btn ghost" id="nextl">Read now</button></div>`;

function gloss(g){return g&&g.length?g.map(x=>`<div class="gloss"><b>${x[0]}</b> = ${x[1]}</div>`).join(""):""}
function read(d,l,i){

  $.innerHTML=`<button class="back" id="b">‹ ${d.title}</button><div class="dots">${l.pages.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div>

function runQuiz(qs,title,onExit,lessonId){
  show("sub");
  let i=0,right=0,earned=0;
  if(!qs.length){onExit();return}
  const lv0=levelInfo(S.xp).lv;
  const showQ=()=>{
    const q=qs[i];
    $.innerHTML=`<button class="back" id="b">‹ Exit</button><div class="dots">${qs.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div>
     <h2>${q.q}</h2>${gloss(q.g)}<div id="opts">${shuffle(q.o.map((_,k)=>k)).map(k=>`<button class="opt" data-k="${k}">${q.o[k]}</button>`).join("")}</div><div id="fb"></div><div class="spacer"></div>`;
    document.getElementById("b").onclick=onExit;
    $.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k,ok=k===q.a;if(ok)right++;
      const g=award(q,ok);earned+=g;
      if(q.id)srUpdate(q.id,ok);save();
      $.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add("ok")});
      if(!ok)b.classList.add("bad");
      if(navigator.vibrate)try{navigator.vibrate(ok?15:[30,40,30])}catch(e){}
      document.getElementById("fb").innerHTML=`<div class="why">${ok?"Correct. ":"Not quite. "}${q.w}${g?` <b class="xpn">+${g} XP</b>`:""}</div><button class="btn" id="n">${i===qs.length-1?"Finish":"Next"}</button>`;
      document.getElementById("n").onclick=()=>{i++;i<qs.length?showQ():finish()};
    });
  };
  const finish=()=>{
    let gain=earned,note="";
    const passed=lessonId&&right>=Math.ceil(qs.length*.67);
    if(passed&&!S.done[lessonId]){
      S.done[lessonId]=1;gain+=25;S.xp+=25;note="Lesson completed +25 XP";
      const dk=DECKS.find(x=>x.lessons.some(l=>l.id===lessonId));
      if(dk&&!S.bonusDeck[dk.id]&&dk.lessons.every(l=>S.done[l.id])){S.bonusDeck[dk.id]=1;gain+=100;S.xp+=100;note+=`<br>${dk.title} deck completed +100 XP`}
    }
    bumpStreak();save();
    const lv1=levelInfo(S.xp).lv,wk=weekly(),goal=S.goal||20;
    if(!gain)note="Already learned, so no new XP. Review still keeps it fresh.";
    $.innerHTML=`<div class="spacer"></div><div class="center"><div class="score">${right}/${qs.length}</div>
     <div class="sub">${title}</div><div class="stats" style="justify-content:center"><span class="chip">+${gain} XP</span><span class="chip">🔥 ${S.streak} day streak</span></div>
     ${note?`<div class="sub" style="margin-top:14px">${note}</div>`:""}
     <div class="sub" style="margin-top:6px">${wk.n} / ${goal} learned this week</div>
     ${lv1>lv0?`<div class="lvup">Level ${lv1}</div>`:""}</div><div class="spacer"></div>
     <button class="btn" id="a">Again</button><button class="btn ghost" id="d">Done</button>`;
    document.getElementById("a").onclick=()=>runQuiz(shuffle(qs),title,onExit,lessonId);
    document.getElementById("d").onclick=onExit;
  };
  showQ();
}

  document.getElementById("rs").onclick=()=>{let o;

      const m=/LEARNBACKUP1:([A-Za-z0-9+\/=\s]+)/i.exec(box.value.replace(/[​-‍⁠﻿]/g,""));

}

/* layout is generated from the data: no hand-placed coordinates */
function buildMap(){
  clusters=[];nodes=[];byId={};
  groupKeys().forEach((gk,gi)=>{
    const ds=DECKS.filter(d=>d.group===gk&&focusOf(d)>0);if(!ds.length)return;
    const R=rng(100+gi*17),sp=118,color=GROUPS[gk].color;
    const items=ds.map((d,k)=>{
      const lv=d.lessons.reduce((m,l)=>Math.max(m,l.lvl),1),L=d.lessons.length,doneN=d.lessons.filter(l=>S.done[l.id]).length;
      let due=0;d.lessons.forEach(l=>{if(S.seen[l.id])l.quiz.forEach(q=>{if(srDue(q.id))due++})});
      return{id:d.id,d,name:d.title,L,doneN,p:L?doneN/L:0,due,levels:lv,color,label:GROUPS[gk].label,r:14+L*1.9,x:0,y:0,seed:gi*100+k+7}});
    items.forEach((n,k)=>{const rad=sp*Math.sqrt(k+.55),ang=k*2.39996+gi*1.3;n.x=Math.cos(ang)*rad+(R()-.5)*sp*.35;n.y=Math.sin(ang)*rad+(R()-.5)*sp*.35});
    for(let it=0;it<90;it++)for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=items[i],b=items[j];let dx=b.x-a.x,dy=b.y-a.y;const dd=Math.hypot(dx,dy)||.01,min=a.r+b.r+42;if(dd<min){const m=(min-dd)/2;dx/=dd;dy/=dd;a.x-=dx*m;a.y-=dy*m;b.x+=dx*m;b.y+=dy*m}}
    const cx=items.reduce((s,n)=>s+n.x,0)/items.length,cy=items.reduce((s,n)=>s+n.y,0)/items.length;
    items.forEach(n=>{n.x-=cx;n.y-=cy});
    const rad=Math.max(...items.map(n=>Math.hypot(n.x,n.y)+n.r))+72;
    clusters.push({gk,color,name:GROUPS[gk].label,items,rad,x:0,y:0,seed:300+gi*11});
  });
  if(!clusters.length){return}
  const maxR=Math.max(...clusters.map(c=>c.rad)),nc=clusters.length;
  clusters.forEach((c,i)=>{const a=i/nc*Math.PI*2-Math.PI/2+.45;c.x=nc>1?Math.cos(a)*maxR*.95:0;c.y=nc>1?Math.sin(a)*maxR*.95:0});

      const per={};n.d.lessons.forEach(l=>{per[l.lvl]=(per[l.lvl]||0)+1});const idx={};

        const done=!!S.done[l.id];let due=false;if(S.seen[l.id])l.quiz.forEach(q=>{if(srDue(q.id))due=true});
        return{x:n.x+Math.cos(a)*rr,y:n.y+Math.sin(a)*rr,done,due:done&&due}})});
  });
  B={x0:Math.min(...clusters.map(c=>c.x-c.rad*1.05)),x1:Math.max(...clusters.map(c=>c.x+c.rad*1.05)),y0:Math.min(...clusters.map(c=>c.y-c.rad*1.05)),y1:Math.max(...clusters.map(c=>c.y+c.rad*1.05))};
}

  ctx.fillStyle=fill;ctx.fillRect(x-w/2-padX,y-h/2-padY,w+padX*2,h+padY*2);ctx.fillStyle="#fff";ctx.fillText(txt,x,y+.5/cam.s);ctx.restore()}
function draw(){
  const s=cam.s;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#0d0e10";ctx.fillRect(0,0,W,H);
  ctx.setTransform(dpr*s,0,0,dpr*s,dpr*cam.x,dpr*cam.y);
  const x0=-cam.x/s,y0=-cam.y/s,x1=(W-cam.x)/s,y1=(H-cam.y)/s;
  const gap=s<.5?160:s<1.2?80:40;ctx.fillStyle="rgba(235,233,228,.075)";const gx=Math.floor(x0/gap)*gap,gy=Math.floor(y0/gap)*gap,dotR=1.1/s;
  for(let x=gx;x<x1;x+=gap)for(let y=gy;y<y1;y+=gap)ctx.fillRect(x-dotR,y-dotR,dotR*2,dotR*2);
  clusters.forEach(c=>{const col=c.color,hot=sel&&sel.c===c;
    trace(c.shape);ctx.fillStyle=rgba(col,.055);ctx.fill();ctx.lineWidth=1.2/s;ctx.strokeStyle=rgba(col,hot?.7:.42);ctx.stroke();
    trace(c.inner);ctx.lineWidth=1/s;ctx.strokeStyle=rgba(col,.15);ctx.stroke()});
  const lit=sel?new Set([sel,...(sel.links||[])]):null;
  if(sel&&sel.links&&sel.links.length){ctx.lineWidth=1.8/s;ctx.setLineDash([7/s,5/s]);ctx.strokeStyle="rgba(255,255,255,.85)";sel.links.forEach((m,i)=>{const dx=m.x-sel.x,dy=m.y-sel.y,dd=Math.hypot(dx,dy)||1,o=(i%2?1:-1)*.12*dd,qx=(sel.x+m.x)/2-dy/dd*o,qy=(sel.y+m.y)/2+dx/dd*o;ctx.beginPath();ctx.moveTo(sel.x,sel.y);ctx.quadraticCurveTo(qx,qy,m.x,m.y);ctx.stroke()});ctx.setLineDash([])}
  nodes.forEach(n=>{if(n.x+n.r*2<x0||n.x-n.r*2>x1||n.y+n.r*2<y0||n.y-n.r*2>y1)return;const col=n.color,isSel=sel===n,isRel=!!lit&&!isSel&&lit.has(n),dim=!!lit&&!isSel&&!isRel;ctx.globalAlpha=dim?.5:1;
    if(n.p>0||isRel){trace(n.glow);ctx.fillStyle=isRel?"rgba(255,255,255,.12)":rgba(col,.05+.1*n.p);ctx.fill()}
    trace(n.shape);ctx.fillStyle="#0d0e10";ctx.fill();ctx.fillStyle=rgba(col,(isRel?.3:.1)+.5*n.p);ctx.fill();ctx.lineWidth=(isSel?2.4:isRel?2.2:1.4)/s;ctx.strokeStyle=isRel?"rgba(255,255,255,.95)":rgba(col,isSel?1:.55+.4*n.p);ctx.stroke();
    if(n.due){ctx.beginPath();ctx.arc(n.x+n.r*.78,n.y-n.r*.78,4.2/s,0,6.283);ctx.fillStyle="#ebe9e4";ctx.fill();ctx.lineWidth=2/s;ctx.strokeStyle="#0d0e10";ctx.stroke()}ctx.globalAlpha=1});
  const la=ramp(s,.85,1.35);if(la>0){ctx.globalAlpha=la;nodes.forEach(n=>{if(n.x+n.r*3<x0||n.x-n.r*3>x1||n.y+n.r*3<y0||n.y-n.r*3>y1)return;const col=n.color;
    ctx.lineWidth=.8/s;ctx.strokeStyle=rgba(col,.14);for(let l=0;l<n.levels;l++){ctx.beginPath();ctx.arc(n.x,n.y,n.r+13+l*9.5,0,6.283);ctx.stroke()}
    n.lessons.forEach(ls=>{ctx.beginPath();ctx.arc(ls.x,ls.y,3.1,0,6.283);if(ls.done){ctx.fillStyle=col;ctx.fill();if(ls.due){ctx.lineWidth=1.6/s;ctx.strokeStyle="#ebe9e4";ctx.stroke()}}else{ctx.fillStyle="#0d0e10";ctx.fill();ctx.lineWidth=1/s;ctx.strokeStyle=rgba(col,.5);ctx.stroke()}})});ctx.globalAlpha=1}
  /* names sit ON the shape, constant screen size, appear when zooming in */
  const dl=ramp(s,.38,.62);
  nodes.forEach(n=>{if(n.x+n.r*3<x0||n.x-n.r*3>x1||n.y+n.r*3<y0||n.y-n.r*3>y1)return;
    const lines=n.lines||(n.lines=splitName(n.name)),two=s>.9,tot=lines.length,blockH=tot*15+(two?15:0),top=n.y-blockH/2/s;
    lines.forEach((ln,i)=>label(ln,n.x,top+(7.5+i*15)/s,13,"#fff",(lit&&lit.has(n))?1:dl,600));
    if(two)label(n.doneN+" of "+n.L,n.x,top+(tot*15+8)/s,11,"#c8cad0",ramp(s,.9,1.2),400)});
  const cn=sel?0:1-ramp(s,.55,.95);
  clusters.forEach(c=>boxLabel(c.name,c.x,c.y,clamp(W/22,15,19),shade(c.color,.78),cn));
  ctx.setTransform(dpr,0,0,dpr,0,0)}

/* interaction: calmer than the prototype (gentler wheel, smoothed pinch, shorter glide) */
const ptr=new Map();let moved=false,down=null,pinch=null,lastMove=0,hintGone=false;
try{hintGone=localStorage.getItem("learn.hint")==="1"}catch(e){}
if(hintGone)hintEl.classList.add("gone");
const toWorld=(x,y)=>[(x-cam.x)/cam.s,(y-cam.y)/cam.s];
function hideHint(){if(hintGone)return;hintGone=true;hintEl.classList.add("gone");try{localStorage.setItem("learn.hint","1")}catch(e){}}
cv.addEventListener("pointerdown",e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}const r=cv.getBoundingClientRect();ptr.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});fly=null;zt=null;vel=null;hideHint();
  if(ptr.size===1){moved=false;down={x:e.clientX-r.left,y:e.clientY-r.top,t:performance.now()};lastMove=performance.now()}
  if(ptr.size===2){moved=true;const[a,b]=[...ptr.values()];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,s0:cam.s,ts:cam.s,w:toWorld(mx,my),mx,my}}
  cv.classList.add("drag")});
cv.addEventListener("pointermove",e=>{const p=ptr.get(e.pointerId);if(!p)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(ptr.size===1){const dx=x-p.x,dy=y-p.y;if(!moved&&Math.hypot(x-down.x,y-down.y)>8)moved=true;if(moved){cam.x+=dx;cam.y+=dy;const now=performance.now(),dt=Math.max(1,now-lastMove);lastMove=now;vel=vel||{x:0,y:0};vel.x=vel.x*.7+dx/dt*.3;vel.y=vel.y*.7+dy/dt*.3;clampCam();request()}}
  else if(ptr.size===2&&pinch){p.x=x;p.y=y;const[a,b]=[...ptr.values()];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,d=Math.hypot(a.x-b.x,a.y-b.y)||1;pinch.mx=mx;pinch.my=my;pinch.ts=clamp(pinch.s0*Math.pow(d/pinch.d,.85),minS()*.9,MAXS);vel=null;request()}
  p.x=x;p.y=y});
function endPtr(e){const had=ptr.delete(e.pointerId);if(!had)return;
  if(ptr.size<2&&pinch){cam.s=clamp(cam.s,minS()*.9,MAXS);pinch=null}
  if(ptr.size===0){cv.classList.remove("drag");
    if(!moved&&down&&performance.now()-down.t<500)tap(down.x,down.y);
    else if(vel&&performance.now()-lastMove<90&&Math.hypot(vel.x,vel.y)>.06){vel.x*=.85;vel.y*=.85;request()}else vel=null;
    if(cam.s<minS()){zt={s:minS(),ax:W/2,ay:H/2,wx:(W/2-cam.x)/cam.s,wy:(H/2-cam.y)/cam.s};request()}}}
cv.addEventListener("pointerup",endPtr);cv.addEventListener("pointercancel",endPtr);
cv.addEventListener("wheel",e=>{e.preventDefault();hideHint();fly=null;vel=null;const r=cv.getBoundingClientRect(),ax=e.clientX-r.left,ay=e.clientY-r.top;
  const dy=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?400:1);const f=Math.exp(-dy*(e.ctrlKey?.008:.0012));
  const base=zt?zt.s:cam.s,ns=clamp(base*f,minS(),MAXS),w=toWorld(ax,ay);zt={s:ns,ax,ay,wx:w[0],wy:w[1]};request()},{passive:false});
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>{if(mapOn)e.preventDefault()}));
cv.addEventListener("keydown",e=>{const k=e.key,st=60;if(k==="+"||k==="="||k==="-"){const f=k==="-"?.8:1.25;const w=[(W/2-cam.x)/cam.s,(H/2-cam.y)/cam.s];zt={s:clamp((zt?zt.s:cam.s)*f,minS(),MAXS),ax:W/2,ay:H/2,wx:w[0],wy:w[1]};request()}
  else if(k==="ArrowLeft"){cam.x+=st;request()}else if(k==="ArrowRight"){cam.x-=st;request()}else if(k==="ArrowUp"){cam.y+=st;request()}else if(k==="ArrowDown"){cam.y-=st;request()}else return;e.preventDefault()});

/* tap, selection, sheet */
function tap(x,y){const[wx,wy]=toWorld(x,y);
  let hit=null,bd=1e9;nodes.forEach(n=>{const d=Math.hypot(n.x-wx,n.y-wy),lim=n.r*1.15+8/cam.s;if(d<lim&&d<bd){bd=d;hit=n}});if(hit){select(hit);return}
  let cl=null;clusters.forEach(c=>{if(Math.hypot(c.x-wx,c.y-wy)<c.rad*.95)cl=c});
  if(cl&&cam.s<.9){sheetOff();const f=fitRect(cl.x-cl.rad,cl.y-cl.rad,cl.x+cl.rad,cl.y+cl.rad,10);flyTo(cl.x,cl.y,f.s,f.sy);return}
  sheetOff()}
function relatedOf(n){const out=(n.d.related||[]).map(id=>byId[id]).filter(m=>m&&m.d.group!==n.d.group),inc=nodes.filter(m=>m!==n&&m.d.group!==n.d.group&&(m.d.related||[]).includes(n.id)),all=[];[...out,...inc].forEach(m=>{if(!all.includes(m))all.push(m)});return all.slice(0,8)}
function select(n){sel=n;n.links=relatedOf(n);document.getElementById("sn").textContent=n.name;document.getElementById("sg").textContent=n.label;document.getElementById("sd").style.background=n.color;
  document.getElementById("sl").textContent=n.doneN+" of "+n.L;document.getElementById("su").textContent=n.due;document.getElementById("sv").textContent=n.levels;
  const b=document.getElementById("sb");b.style.width=Math.round(n.p*100)+"%";b.style.background=n.color;sheet.hidden=false;
  document.getElementById("sa").textContent=(n.d.about&&n.d.about[0])||"";
  document.getElementById("sr").textContent=n.links.length?"Related: "+n.links.map(m=>m.name).join(", "):"";
  const sh=sheet.getBoundingClientRect().height||190;
  if(n.links.length){const pts=[n,...n.links],bx0=Math.min(...pts.map(q=>q.x-q.r)),bx1=Math.max(...pts.map(q=>q.x+q.r)),by0=Math.min(...pts.map(q=>q.y-q.r)),by1=Math.max(...pts.map(q=>q.y+q.r));
    const top=100,bot=sh+78,pad=34,sFit=Math.min((W-2*pad)/(bx1-bx0),(H-top-bot-2*pad)/(by1-by0)),ts=clamp(sFit,minS(),1.5);flyTo((bx0+bx1)/2,(by0+by1)/2,ts,top+(H-top-bot)/2,650)}
  else{const target=Math.max(cam.s,1.5),sy=Math.max(110,(H-sh-70)/2+20);flyTo(n.x,n.y,target,sy,600)}
  request()}
function sheetOff(){sel=null;sheet.hidden=true;if(mapOn)request()}
document.getElementById("sx").onclick=sheetOff;
document.getElementById("go").onclick=()=>{if(sel)deck(sel.id)};
document.getElementById("fit").onclick=()=>{sheetOff();hideHint();fitAll(true)};

function enterMap(){mapOn=true;size();const sig=layoutSig();
  if(sig!==mapSig||!camReady){buildMap();mapSig=sig;if(!camReady||!clusters.length){fitAll(false);camReady=true}else clampCam()}else{buildMap()}
  sel=null;sheet.hidden=true;request()}
function stopMap(){mapOn=false;if(raf){cancelAnimationFrame(raf);raf=0}}
new ResizeObserver(()=>{if(!mapOn)return;const had=W>0,cx=(W/2-cam.x)/cam.s,cy=(H/2-cam.y)/cam.s;size();if(!had||!clusters.length){fitAll(false)}else{const old=fitS;const f=fitRect(B.x0,B.y0,B.x1,B.y1,14);fitS=f.s;cam.s=clamp(cam.s*f.s/old,minS(),MAXS);cam.x=W/2-cx*cam.s;cam.y=H/2-cy*cam.s;request()}}).observe(cv);
if(document.fonts){['600 14px "Instrument Sans"','500 14px "Instrument Sans"','400 12px "Instrument Sans"'].forEach(f=>document.fonts.load(f).then(()=>request()).catch(()=>{}))}

updateHeader();
load();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
