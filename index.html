<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Learn</title>
<meta name="theme-color" content="#0f1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Learn">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0f1220;--card:#181c30;--card2:#20253d;--text:#eef0fa;--mute:#98a0c3;--accent:#7c6cf0;--ok:#35c98a;--bad:#ef5b6b;--warn:#f5b84b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column}
h1{font-size:26px;margin:0}h2{font-size:21px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.chips{display:flex;gap:8px;align-items:center}
.chip{background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
.gear{background:var(--card);border:0;color:var(--text);border-radius:999px;width:34px;height:34px;font-size:16px;cursor:pointer}
.sub{color:var(--mute);font-size:14px;margin:2px 0 14px}
.sec{color:var(--mute);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:18px 0 8px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.deck{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;color:inherit;font:inherit;cursor:pointer;padding:13px 14px}
.deck:active{transform:scale(.985)}
.emoji{font-size:28px;width:48px;height:48px;border-radius:14px;background:var(--card2);display:grid;place-items:center;flex:none}
.deck b{display:block;font-size:16px}.deck small{color:var(--mute);font-size:13px}
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-size:17px;font-weight:700;color:#fff;background:var(--accent);cursor:pointer;margin-top:10px}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.sm{padding:11px;font-size:15px}
.btn:disabled{opacity:.4}
.btn:active{filter:brightness(.9)}
.big{background:linear-gradient(135deg,#4f46e5,#8b5cf6);border-radius:20px;padding:18px;margin-bottom:12px}
.big.alt{background:linear-gradient(135deg,#0f766e,#14b8a6)}
.big h2{margin:0}.big p{margin:4px 0 0;opacity:.92;font-size:14px}
.big .btn{background:rgba(255,255,255,.22);margin-top:12px}
.back{background:none;border:0;color:var(--mute);font:inherit;font-size:16px;padding:6px 0;cursor:pointer;text-align:left}
.read{font-size:18px;line-height:1.55}
.read b{color:#fff}.read .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent);text-transform:uppercase;margin-bottom:6px}
.read ul{padding-left:20px}.read li{margin:6px 0}
.opt{display:block;width:100%;text-align:left;border:2px solid transparent;background:var(--card);color:var(--text);border-radius:14px;padding:15px;font:inherit;font-size:17px;margin-top:10px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:rgba(53,201,138,.14)}
.opt.bad{border-color:var(--bad);background:rgba(239,91,107,.14)}
.why{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--card2);font-size:15px;line-height:1.45}
.src{color:var(--mute);font-size:12px;margin-top:10px;line-height:1.5}.src a{color:var(--mute)}
.gloss{margin:2px 0 6px;padding:9px 12px;border-left:3px solid var(--warn);background:rgba(245,184,75,.08);border-radius:0 10px 10px 0;font-size:14px;line-height:1.4;color:#e9dcc0}
.gloss b{color:var(--warn)}
.lvlh{color:var(--mute);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin:14px 0 6px}
.row{display:flex;gap:8px}.row .btn{margin-top:8px}
.spacer{flex:1}
.center{text-align:center}.score{font-size:64px;font-weight:800;margin:18px 0 4px}
.dots{display:flex;gap:5px;justify-content:center;margin:6px 0 16px;flex-wrap:wrap}.dots i{width:8px;height:8px;border-radius:50%;background:var(--card2)}.dots i.on{background:var(--accent)}
.note{color:var(--mute);font-size:13px;text-align:center;margin-top:18px}
.set{background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px}.set b{font-size:15px}
.set .p{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.set .p button{height:40px;border:0;border-radius:10px;background:var(--card2);color:var(--text);font:inherit;font-size:15px;cursor:pointer}
.set .p button.on{background:var(--accent);font-weight:700}.set .p button.z.on{background:var(--bad)}
</style>
</head>
<body>
<div id="app"><div class="note">Loading…</div></div>
<script>
/* ---------- STATE ---------- */
const KEY="learn.v1";
let S={xp:0,streak:0,last:"",done:{},seen:{},focus:{},sr:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const dayNum=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)};
const dstr=n=>new Date(n*864e5).toISOString().slice(0,10);
function bumpStreak(){const t=dayNum();if(S.last===dstr(t))return;S.streak=(S.last===dstr(t-1))?S.streak+1:1;S.last=dstr(t)}
const streakNow=()=>{const t=dayNum();return (S.last===dstr(t)||S.last===dstr(t-1))?S.streak:0};
const INTERVALS=[0,1,3,7,16,35];
function srDue(id){const r=S.sr[id];return !r||r.d<=dayNum()}
function srUpdate(id,ok){const r=S.sr[id]||{b:0};r.b=ok?Math.min(r.b+1,5):0;r.d=dayNum()+INTERVALS[r.b];S.sr[id]=r}
const $=document.getElementById("app");
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
let GROUPS={brand:"Brands",base:"Base topics",life:"Life skills"};
let DECKS=[];

/* ---------- LOAD CONTENT ---------- */
async function load(){
  let idx;
  try{idx=await (await fetch("content/index.json",{cache:"no-store"})).json()}catch(e){$.innerHTML='<div class="note">Could not load content. Check your internet and reopen.</div>';return}
  if(idx.groups)GROUPS=idx.groups;
  idx.decks.forEach(m=>{if(m.group&&!GROUPS[m.group])GROUPS[m.group]=m.group});
  const res=await Promise.all(idx.decks.map(async m=>{
    try{const d=await (await fetch("content/"+m.id+".json",{cache:"no-store"})).json();
      d.id=m.id;d.group=m.group||d.group||"base";d.deffocus=m.focus==null?3:m.focus;
      d.lessons=(d.lessons||[]).filter(l=>l.pages&&l.quiz&&l.quiz.length);
      d.lessons.forEach(l=>{l.lvl=l.lvl||1;l.quiz.forEach((q,i)=>{q.id=l.id+"#"+i})});
      d.lessons.sort((a,b)=>a.lvl-b.lvl);
      return d.lessons.length?d:null}catch(e){return null}}));
  DECKS=res.filter(Boolean);
  home();
}
const focusOf=d=>S.focus[d.id]==null?d.deffocus:S.focus[d.id];

/* ---------- VIEWS ---------- */
function topbar(){return `<div class="top"><h1>Learn</h1><div class="chips"><span class="chip">🔥 ${streakNow()}</span><span class="chip">⭐ ${S.xp}</span><button class="gear" id="gear" aria-label="Settings">⚙</button></div></div>`}
function pool(){const out=[];DECKS.forEach(d=>{const f=focusOf(d);if(!f)return;d.lessons.forEach(l=>{if(S.seen[l.id])l.quiz.forEach(q=>out.push({q,f,due:srDue(q.id)}))})});return out}
function pickQuick(n){
  const p=pool(),w=x=>Math.random()/x.f;
  const due=p.filter(x=>x.due).sort((a,b)=>w(a)-w(b)),rest=p.filter(x=>!x.due).sort((a,b)=>w(a)-w(b));
  const picked=due.slice(0,n);if(picked.length<Math.min(6,p.length))picked.push(...rest.slice(0,Math.min(6,p.length)-picked.length));
  return shuffle(picked.map(x=>x.q));
}
function nextLesson(){
  const ds=DECKS.filter(d=>focusOf(d)>0).sort((a,b)=>focusOf(b)-focusOf(a));
  for(const d of ds){const l=d.lessons.find(l=>!S.done[l.id]);if(l)return {d,l}}return null;
}
function home(){
  const p=pool(),dueN=p.filter(x=>x.due).length,nx=nextLesson();
  let h=topbar();
  h+=p.length?`<div class="big"><h2>Quick quiz</h2><p>${dueN?dueN+" question"+(dueN>1?"s":"")+" due for review.":"Nothing due. Practice anyway."} About 2 minutes.</p><button class="btn" id="quick">Start</button></div>`
    :`<div class="big"><h2>Welcome</h2><p>Read a short lesson, then get quizzed. Finish one lesson to unlock Quick quiz.</p></div>`;
  if(nx)h+=`<div class="big alt"><h2>Next lesson</h2><p>${nx.d.emoji} ${nx.d.title}: ${nx.l.title}</p><button class="btn" id="nextl">Read now</button></div>`;
  Object.keys(GROUPS).forEach(g=>{
    const ds=DECKS.filter(d=>d.group===g&&focusOf(d)>0).sort((a,b)=>focusOf(b)-focusOf(a));
    if(!ds.length)return;
    h+=`<div class="sec">${GROUPS[g]}</div>`+ds.map(d=>{const n=d.lessons.length,k=d.lessons.filter(l=>S.done[l.id]).length;
      return `<button class="card deck" data-d="${d.id}"><div class="emoji">${d.emoji||"📘"}</div><div style="flex:1"><b>${d.title}</b><small>${d.desc||""} • ${k}/${n}</small><div class="bar"><i style="width:${k/n*100}%"></i></div></div></button>`}).join("");
  });
  $.innerHTML=h;
  document.getElementById("gear").onclick=settings;
  $.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>deck(b.dataset.d));
  const q=document.getElementById("quick");if(q)q.onclick=()=>runQuiz(pickQuick(8),"Quick quiz",home);
  const n=document.getElementById("nextl");if(n)n.onclick=()=>read(nx.d,nx.l,0);
}
function deck(id){
  const d=DECKS.find(x=>x.id===id);let lastLvl=0,h=`<button class="back" id="b">‹ Back</button><div class="top"><h1>${d.emoji||""} ${d.title}</h1></div>`;
  d.lessons.forEach(l=>{
    if(l.lvl!==lastLvl){h+=`<div class="lvlh">Level ${l.lvl}</div>`;lastLvl=l.lvl}
    h+=`<div class="card"><b>${l.title}</b><div class="sub" style="margin-bottom:0">${S.done[l.id]?"✅ Completed":"About 2 min"}</div>
    <div class="row"><button class="btn sm" data-r="${l.id}">Read &amp; learn</button><button class="btn sm ghost" data-t="${l.id}" ${S.seen[l.id]?"":"disabled"}>Quiz only</button></div></div>`});
  if(d.src&&d.src.length)h+=`<div class="src">Sources: ${d.src.map(s=>`<a href="${s.u}" target="_blank" rel="noopener">${s.l}</a>`).join(" · ")}</div>`;
  $.innerHTML=h;
  document.getElementById("b").onclick=home;
  $.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>read(d,d.lessons.find(l=>l.id===b.dataset.r),0));
  $.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const l=d.lessons.find(l=>l.id===b.dataset.t);runQuiz(shuffle(l.quiz),l.title,()=>deck(id),l.id)});
}
function gloss(g){return g&&g.length?g.map(x=>`<div class="gloss"><b>${x[0]}</b> = ${x[1]}</div>`).join(""):""}
function read(d,l,i){
  const p=l.pages[i],last=i===l.pages.length-1;
  const src=last&&l.src&&l.src.length?`<div class="src">Source: ${l.src.map(s=>`<a href="${s.u}" target="_blank" rel="noopener">${s.l}</a>`).join(" · ")}</div>`:"";
  $.innerHTML=`<button class="back" id="b">‹ ${d.title}</button><div class="dots">${l.pages.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div>
   <div class="card read"><div class="tag">${l.title}</div><h2>${p.h}</h2>${p.t}${gloss(p.g)}${src}</div><div class="spacer"></div>
   <button class="btn" id="n">${last?"Start quiz":"Next"}</button>`;
  document.getElementById("b").onclick=()=>deck(d.id);
  document.getElementById("n").onclick=()=>{if(last){S.seen[l.id]=1;save();runQuiz(shuffle(l.quiz),l.title,()=>deck(d.id),l.id)}else read(d,l,i+1)};
}
function runQuiz(qs,title,onExit,lessonId){
  let i=0,right=0;
  if(!qs.length){onExit();return}
  const show=()=>{
    const q=qs[i];
    $.innerHTML=`<button class="back" id="b">‹ Exit</button><div class="dots">${qs.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div>
     <h2>${q.q}</h2>${gloss(q.g)}<div id="opts">${shuffle(q.o.map((_,k)=>k)).map(k=>`<button class="opt" data-k="${k}">${q.o[k]}</button>`).join("")}</div><div id="fb"></div><div class="spacer"></div>`;
    document.getElementById("b").onclick=onExit;
    $.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k,ok=k===q.a;if(ok)right++;
      if(q.id)srUpdate(q.id,ok);save();
      $.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add("ok")});
      if(!ok)b.classList.add("bad");
      if(navigator.vibrate)try{navigator.vibrate(ok?15:[30,40,30])}catch(e){}
      document.getElementById("fb").innerHTML=`<div class="why">${ok?"✅ Correct. ":"❌ Not quite. "}${q.w}</div><button class="btn" id="n">${i===qs.length-1?"Finish":"Next"}</button>`;
      document.getElementById("n").onclick=()=>{i++;i<qs.length?show():finish()};
    });
  };
  const finish=()=>{
    const gain=right*10+(right===qs.length?10:0);
    S.xp+=gain;bumpStreak();if(lessonId&&right>=Math.ceil(qs.length*.67))S.done[lessonId]=1;save();
    $.innerHTML=`<div class="spacer"></div><div class="center"><div style="font-size:48px">${right===qs.length?"🎉":right?"👍":"💪"}</div><div class="score">${right}/${qs.length}</div>
     <div class="sub">${title}</div><div class="chips" style="justify-content:center"><span class="chip">+${gain} XP</span><span class="chip">🔥 ${S.streak} day streak</span></div></div><div class="spacer"></div>
     <button class="btn" id="a">Again</button><button class="btn ghost" id="d">Done</button>`;
    document.getElementById("a").onclick=()=>runQuiz(shuffle(qs),title,onExit,lessonId);
    document.getElementById("d").onclick=onExit;
  };
  show();
}
function settings(){
  let h=`<button class="back" id="b">‹ Back</button><div class="top"><h1>Focus</h1></div><div class="sub">0 hides a topic. 5 means more questions from it in Quick quiz and it comes first in Next lesson.</div>`;
  Object.keys(GROUPS).forEach(g=>{const ds=DECKS.filter(d=>d.group===g);if(!ds.length)return;h+=`<div class="sec">${GROUPS[g]}</div>`+ds.map(d=>{const f=focusOf(d);
    return `<div class="set"><b>${d.emoji||""} ${d.title}</b><div class="p" data-d="${d.id}">${[0,1,2,3,4,5].map(i=>`<button class="${i===0?"z ":""}${i===f?"on":""}" data-v="${i}">${i}</button>`).join("")}</div></div>`}).join("")});
  h+=`<button class="btn ghost" id="reset" style="margin-top:20px">Reset all progress</button><div class="note">${DECKS.reduce((n,d)=>n+d.lessons.length,0)} lessons loaded</div>`;
  $.innerHTML=h;
  document.getElementById("b").onclick=home;
  $.querySelectorAll(".p").forEach(p=>p.querySelectorAll("button").forEach(b=>b.onclick=()=>{S.focus[p.dataset.d]=+b.dataset.v;save();p.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))}));
  document.getElementById("reset").onclick=()=>{if(confirm("Reset streak, XP and all progress?")){const f=S.focus;S={xp:0,streak:0,last:"",done:{},seen:{},focus:f,sr:{}};save();home()}};
}
load();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
