<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"></head><body>
<title>Learn Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d0e10">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,wght@1,400;1,500&display=swap">
<style>
/* Atlas on near-black: organic territories, hairline contours, serif place names, colour only for meaning. */
:root{--bg:#0d0e10;--fg:#ebe9e4;--mute:#8d9099;--line:#26282d;--panel:#14161a;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Newsreader",Georgia,serif;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#map.drag{cursor:grabbing}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--bg) 55%,rgba(13,14,16,0));pointer-events:none}
.top>*{pointer-events:auto}
.word{font-weight:600;font-size:20px;letter-spacing:-.01em}
.stats{display:flex;align-items:center;gap:8px}
.chip{border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;background:var(--panel);white-space:nowrap}
.lvl{display:flex;flex-direction:column;gap:4px;min-width:54px}
.lvl b{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.lvl i{display:block;height:2px;background:var(--line)}
.lvl i u{display:block;height:100%;width:42%;background:var(--fg);text-decoration:none}
.gear{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;width:32px;height:30px;display:grid;place-items:center;cursor:pointer;padding:0}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-top:1px solid var(--line);
  padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
.tab{background:none;border:0;color:var(--mute);font:500 12px var(--sans);letter-spacing:.03em;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.tab[aria-current=page]{color:var(--fg);box-shadow:inset 0 2px 0 var(--fg)}
.fit{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 58px);width:38px;height:38px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);transform:translateX(-50%);font-size:13px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 11px;white-space:nowrap;transition:opacity .5s;pointer-events:none}
#hint.gone{opacity:0}
#sheet{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 64px);max-width:460px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px}
#sheet h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
#sheet .g{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px;margin:3px 0 10px}
#sheet .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
#sheet .rows{display:flex;gap:22px;font-size:14px;font-variant-numeric:tabular-nums}
#sheet .rows span{color:var(--mute);display:block;font-size:12px}
#sheet .bar{height:3px;background:var(--line);margin:12px 0 14px}
#sheet .bar i{display:block;height:100%}
#sheet button.go{width:100%;border:1px solid var(--fg);background:var(--fg);color:var(--bg);font:600 15px var(--sans);padding:11px;border-radius:6px;cursor:pointer}
#sheet .x{position:absolute;right:8px;top:8px;border:0;background:none;color:var(--mute);width:30px;height:30px;font-size:20px;cursor:pointer}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:13px;font-weight:500;padding:8px 12px;border-radius:6px;max-width:80vw;text-align:center}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>

<canvas id="map" tabindex="0" role="img" aria-label="Knowledge map. Drag to move, pinch or scroll to zoom. Topics are grouped into coloured territories."></canvas>
<header class="top">
  <div class="word">Learn</div>
  <div class="stats">
    <div class="lvl" aria-label="Level 4, 42 percent to level 5"><b>Lv 4</b><i><u></u></i></div>
    <span class="chip">🔥 5</span><span class="chip">⭐ 320</span>
    <button class="gear" data-demo aria-label="Settings"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>
<button class="fit" id="fit" aria-label="Show the whole map"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
<div id="hint">Drag to move. Pinch or scroll to zoom. Tap a topic.</div>
<aside id="sheet" hidden>
  <button class="x" id="sx" aria-label="Close">×</button>
  <h2 id="sn"></h2>
  <div class="g"><span class="dot" id="sd"></span><span id="sg"></span></div>
  <div class="rows"><div><span>Lessons done</span><b id="sl"></b></div><div><span>Due for review</span><b id="su"></b></div><div><span>Levels</span><b id="sv"></b></div></div>
  <div class="bar"><i id="sb"></i></div>
  <button class="go" data-demo>Open lessons</button>
</aside>
<nav class="tabs" aria-label="Main">
  <button class="tab" data-demo><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Today</button>
  <button class="tab" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="6" r="2"/><circle cx="14" cy="17" r="3"/><path d="M8 8l4 7M16 7l-1 7"/></svg>Map</button>
  <button class="tab" data-demo><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
</nav>
<div id="toast" hidden></div>

<script>
(()=>{
/* ---------- demo data (names only, nothing real is wired up) ---------- */
const GROUPS=[
 {id:'brands',name:'Brands',color:'#ee6a4f',decks:[['Stormshield',12,.58,3],['Ubiquiti',12,.25,2],['Shelly',12,.08,0],['Aginet',10,0,0],['Shokz',9,0,0],['Yealink',9,0,0],['Insta360',8,0,0],['Allnet line',8,0,0],['TP-Link Omada',5,0,0],['Zyxel',5,0,0],['Teltonika',5,0,0],['Cudy',5,0,0],['Aqara',5,0,0]]},
 {id:'it',name:'IT basics',color:'#5aa2ff',decks:[['Network basics',9,.89,1],['Firewalls',9,.55,4],['Switching and PoE',9,.22,0],['Wi-Fi',9,0,0],['Surveillance',11,0,0],['Mobile broadband',11,0,0],['IT versus OT',10,0,0],['Licensing',10,0,0]]},
 {id:'ai',name:'AI',color:'#43c59e',decks:[['Prompting',10,.3,2],['Programming',10,0,0],['Excel and tools',8,0,0]]},
 {id:'phil',name:'Philosophy',color:'#e2b04a',decks:[['Socrates',5,0,0],['Plato',6,0,0],['Aristotle',6,0,0],['The Stoics',8,0,0],['Marcus Aurelius',5,0,0]]}
];
const LINKS=[['Firewalls','Stormshield'],['Surveillance','Ubiquiti'],['Mobile broadband','Teltonika'],['Switching and PoE','Ubiquiti'],['Wi-Fi','TP-Link Omada'],['IT versus OT','Stormshield'],['Prompting','Excel and tools'],['Prompting','Programming'],['The Stoics','Marcus Aurelius'],['Socrates','Plato'],['Plato','Aristotle'],['Network basics','Firewalls']];

/* ---------- helpers ---------- */
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const ramp=(v,a,b)=>clamp((v-a)/(b-a),0,1);
function blob(cx,cy,r,seed,amp){const R=rng(seed);const h=[[2,R()*amp,R()*6.28],[3,R()*amp*.8,R()*6.28],[5,R()*amp*.5,R()*6.28]];const sx=.88+R()*.24,sy=.88+R()*.24;const N=44,pts=[];for(let i=0;i<N;i++){const a=i/N*Math.PI*2;let k=1;for(const[f,m,p]of h)k+=m*Math.sin(f*a+p);pts.push([cx+Math.cos(a)*r*k*sx,cy+Math.sin(a)*r*k*sy])}return pts}
function trace(ctx,pts){const n=pts.length;ctx.beginPath();ctx.moveTo((pts[n-1][0]+pts[0][0])/2,(pts[n-1][1]+pts[0][1])/2);for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];ctx.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2)}ctx.closePath()}

/* ---------- layout: generated from the data, no hand-placed coordinates ---------- */
const clusters=[],byName={};
GROUPS.forEach((g,gi)=>{
  const R=rng(100+gi*17),sp=118;
  const items=g.decks.map((d,k)=>({name:d[0],L:d[1],p:d[2],due:d[3],g,r:14+d[1]*1.9,x:0,y:0,seed:gi*100+k+7}));
  items.forEach((n,k)=>{const rad=sp*Math.sqrt(k+.55),ang=k*2.39996+gi*1.3;n.x=Math.cos(ang)*rad+(R()-.5)*sp*.35;n.y=Math.sin(ang)*rad+(R()-.5)*sp*.35});
  for(let it=0;it<90;it++)for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=items[i],b=items[j];let dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy)||.01,min=a.r+b.r+42;if(d<min){const m=(min-d)/2;dx/=d;dy/=d;a.x-=dx*m;a.y-=dy*m;b.x+=dx*m;b.y+=dy*m}}
  const cx=items.reduce((s,n)=>s+n.x,0)/items.length,cy=items.reduce((s,n)=>s+n.y,0)/items.length;
  items.forEach(n=>{n.x-=cx;n.y-=cy});
  const rad=Math.max(...items.map(n=>Math.hypot(n.x,n.y)+n.r))+72;
  clusters.push({g,items,rad,x:0,y:0,seed:300+gi*11});
});
const maxR=Math.max(...clusters.map(c=>c.rad));
clusters.forEach((c,i)=>{const a=i/clusters.length*Math.PI*2-Math.PI/2+.45;c.x=Math.cos(a)*maxR*.95;c.y=Math.sin(a)*maxR*.95});
for(let it=0;it<400;it++){for(let i=0;i<clusters.length;i++)for(let j=i+1;j<clusters.length;j++){const a=clusters[i],b=clusters[j];let dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy)||.01,min=a.rad+b.rad+40;if(d<min){const m=(min-d)/2;dx/=d;dy/=d;a.x-=dx*m;a.y-=dy*m;b.x+=dx*m;b.y+=dy*m}}clusters.forEach(c=>{c.x*=.996;c.y*=.996})}
const nodes=[],edges=[];
clusters.forEach(c=>{
  c.shape=blob(c.x,c.y,c.rad,c.seed,.1);c.inner=blob(c.x,c.y,c.rad*.86,c.seed+1,.12);c.outer=blob(c.x,c.y,c.rad*1.1,c.seed+2,.08);
  c.items.forEach(n=>{n.x+=c.x;n.y+=c.y;n.c=c;n.shape=blob(n.x,n.y,n.r,n.seed,.14);n.glow=blob(n.x,n.y,n.r*1.35,n.seed,.14);byName[n.name]=n;nodes.push(n);
    const lv=clamp(Math.ceil(n.L/2.3),2,5),per=[];for(let i=0;i<lv;i++)per.push(0);
    n.lessons=[];for(let i=0;i<n.L;i++){const l=Math.floor(i*lv/n.L);per[l]++;n.lessons.push({lv:l,k:per[l]-1})}
    n.lessons.forEach(ls=>{ls.n=per[ls.lv]});n.levels=lv;const done=Math.round(n.p*n.L);
    n.lessons.forEach((ls,i)=>{ls.done=i<done;ls.due=ls.done&&i>=done-n.due;const a=ls.k/ls.n*Math.PI*2+ls.lv*.7,rr=n.r+13+ls.lv*9.5;ls.x=n.x+Math.cos(a)*rr;ls.y=n.y+Math.sin(a)*rr});n.doneN=done});
  c.items.forEach((n,k)=>{if(!k)return;let best=null,bd=1e9;for(let j=0;j<k;j++){const m=c.items[j],d=Math.hypot(m.x-n.x,m.y-n.y);if(d<bd){bd=d;best=m}}edges.push({a:n,b:best,cross:false})});
});
LINKS.forEach(([a,b])=>{if(byName[a]&&byName[b]&&byName[a].c!==byName[b].c)edges.push({a:byName[a],b:byName[b],cross:true})});
edges.forEach((e,i)=>{const R=rng(900+i),dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,d=Math.hypot(dx,dy),o=(R()-.5)*.28*d;e.cx=(e.a.x+e.b.x)/2-dy/d*o;e.cy=(e.a.y+e.b.y)/2+dx/d*o});
const B={x0:Math.min(...clusters.map(c=>c.x-c.rad*1.1)),x1:Math.max(...clusters.map(c=>c.x+c.rad*1.1)),y0:Math.min(...clusters.map(c=>c.y-c.rad*1.1)),y1:Math.max(...clusters.map(c=>c.y+c.rad*1.1))};

/* ---------- canvas and camera ---------- */
const cv=document.getElementById('map'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1;const cam={x:0,y:0,s:.3};let fitS=.3,zt=null,vel=null,fly=null,sel=null,raf=0,last=0;
const MAXS=5.5;
const minS=()=>fitS*.75;
function size(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);request()}
function viewBox(){const top=64,bot=76;return{w:W,h:H-top-bot,cy:top+(H-top-bot)/2}}
function fitRect(x0,y0,x1,y1,pad){const v=viewBox();const s=Math.min((v.w-pad*2)/(x1-x0),(v.h-pad*2)/(y1-y0));return{s,cx:(x0+x1)/2,cy:(y0+y1)/2,sy:v.cy}}
function setCam(cx,cy,s,sy){cam.s=s;cam.x=W/2-cx*s;cam.y=(sy==null?H/2:sy)-cy*s}
function fitAll(animate){const f=fitRect(B.x0,B.y0,B.x1,B.y1,14);fitS=f.s;if(animate)flyTo(f.cx,f.cy,f.s,f.sy);else{setCam(f.cx,f.cy,f.s,f.sy);request()}}
function clampCam(){const wx=(W/2-cam.x)/cam.s,wy=(H/2-cam.y)/cam.s;const nx=clamp(wx,B.x0,B.x1),ny=clamp(wy,B.y0,B.y1);if(nx!==wx)cam.x=W/2-nx*cam.s;if(ny!==wy)cam.y=H/2-ny*cam.s}
function flyTo(cx,cy,s,sy,dur){zt=null;vel=null;const wy=sy==null?H/2:sy;fly={t0:performance.now(),dur:dur||650,fx:(W/2-cam.x)/cam.s,fy:(wy-cam.y)/cam.s,fs:Math.log(cam.s),tx:cx,ty:cy,ts:Math.log(clamp(s,minS(),MAXS)),sy:wy};request()}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let reqT=0;function request(){const now=performance.now();if(raf&&now-reqT>250){cancelAnimationFrame(raf);raf=0}if(!raf){reqT=now;raf=requestAnimationFrame(frame)}}
function frame(t){raf=0;const dt=Math.min(50,(t-last)||16);last=t;let active=false;
  if(fly){const p=clamp((performance.now()-fly.t0)/fly.dur,0,1),e=ease(p);const s=Math.exp(fly.fs+(fly.ts-fly.fs)*e),cx=fly.fx+(fly.tx-fly.fx)*e,cy=fly.fy+(fly.ty-fly.fy)*e;cam.s=s;cam.x=W/2-cx*s;cam.y=fly.sy-cy*s;if(p>=1)fly=null;active=true}
  if(zt){const k=1-Math.exp(-dt/85);let ns=cam.s+(zt.s-cam.s)*k;const done=Math.abs(zt.s-ns)<zt.s*.001;if(done)ns=zt.s;cam.s=ns;cam.x=zt.ax-zt.wx*ns;cam.y=zt.ay-zt.wy*ns;if(done)zt=null;active=true}
  if(vel){cam.x+=vel.x*dt;cam.y+=vel.y*dt;const f=Math.exp(-dt/325);vel.x*=f;vel.y*=f;if(Math.hypot(vel.x,vel.y)<.012)vel=null;active=true}
  if(!fly)clampCam();
  draw();if(active)request()}

/* ---------- drawing ---------- */
function font(px,family){return `${px/cam.s}px ${family}`}
function label(txt,x,y,px,family,color,alpha,weight,italic,spacing){if(alpha<=.01)return;ctx.save();ctx.globalAlpha=alpha;ctx.font=`${italic?'italic ':''}${weight||400} ${px/cam.s}px ${family}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=5/cam.s;ctx.strokeStyle='rgba(13,14,16,.88)';ctx.strokeText(txt,x,y);ctx.fillStyle=color;ctx.fillText(txt,x,y);ctx.restore()}
function draw(){
  const s=cam.s;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0d0e10';ctx.fillRect(0,0,W,H);
  ctx.setTransform(dpr*s,0,0,dpr*s,dpr*cam.x,dpr*cam.y);
  const x0=-cam.x/s,y0=-cam.y/s,x1=(W-cam.x)/s,y1=(H-cam.y)/s;
  const gap=s<.5?160:s<1.2?80:40;ctx.fillStyle='rgba(235,233,228,.075)';const gx=Math.floor(x0/gap)*gap,gy=Math.floor(y0/gap)*gap;const dotR=1.1/s;
  for(let x=gx;x<x1;x+=gap)for(let y=gy;y<y1;y+=gap){ctx.fillRect(x-dotR,y-dotR,dotR*2,dotR*2)}
  const sans='"Instrument Sans",system-ui,sans-serif',serif='Newsreader,Georgia,serif';
  // territories
  clusters.forEach(c=>{const col=c.g.color,hot=sel&&sel.c===c;
    trace(ctx,c.outer);ctx.lineWidth=1/s;ctx.strokeStyle=rgba(col,hot?.22:.12);ctx.stroke();
    trace(ctx,c.shape);ctx.fillStyle=rgba(col,.055);ctx.fill();ctx.lineWidth=1.2/s;ctx.strokeStyle=rgba(col,hot?.7:.42);ctx.stroke();
    trace(ctx,c.inner);ctx.lineWidth=1/s;ctx.strokeStyle=rgba(col,.17);ctx.stroke()});
  // edges
  const ea=ramp(s,.16,.3);if(ea>0){ctx.lineWidth=1/s;edges.forEach(e=>{ctx.globalAlpha=ea*(e.cross?.5:.8);ctx.strokeStyle=e.cross?'rgba(235,233,228,.3)':rgba(e.a.c.g.color,.45);if(e.cross)ctx.setLineDash([5/s,5/s]);ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.quadraticCurveTo(e.cx,e.cy,e.b.x,e.b.y);ctx.stroke();if(e.cross)ctx.setLineDash([])});ctx.globalAlpha=1}
  // decks
  nodes.forEach(n=>{if(n.x+n.r*2<x0||n.x-n.r*2>x1||n.y+n.r*2<y0||n.y-n.r*2>y1)return;const col=n.c.g.color,isSel=sel===n;
    if(n.p>0){trace(ctx,n.glow);ctx.fillStyle=rgba(col,.05+.1*n.p);ctx.fill()}
    trace(ctx,n.shape);ctx.fillStyle='#0d0e10';ctx.fill();ctx.fillStyle=rgba(col,.1+.5*n.p);ctx.fill();ctx.lineWidth=(isSel?2.4:1.4)/s;ctx.strokeStyle=rgba(col,isSel?1:.55+.4*n.p);ctx.stroke();
    if(n.due){ctx.beginPath();ctx.arc(n.x+n.r*.78,n.y-n.r*.78,4.2/s,0,6.283);ctx.fillStyle='#ebe9e4';ctx.fill();ctx.lineWidth=2/s;ctx.strokeStyle='#0d0e10';ctx.stroke()}});
  // lessons
  const la=ramp(s,.85,1.35);if(la>0){ctx.globalAlpha=la;nodes.forEach(n=>{if(n.x+n.r*3<x0||n.x-n.r*3>x1||n.y+n.r*3<y0||n.y-n.r*3>y1)return;const col=n.c.g.color;
    ctx.lineWidth=.8/s;ctx.strokeStyle=rgba(col,.14);for(let l=0;l<n.levels;l++){ctx.beginPath();ctx.arc(n.x,n.y,n.r+13+l*9.5,0,6.283);ctx.stroke()}
    n.lessons.forEach(ls=>{ctx.beginPath();ctx.arc(ls.x,ls.y,3.1,0,6.283);if(ls.done){ctx.fillStyle=col;ctx.fill();if(ls.due){ctx.lineWidth=1.6/s;ctx.strokeStyle='#ebe9e4';ctx.stroke()}}else{ctx.fillStyle='#0d0e10';ctx.fill();ctx.lineWidth=1/s;ctx.strokeStyle=rgba(col,.5);ctx.stroke()}})});ctx.globalAlpha=1}
  // labels
  const dl=ramp(s,.3,.5);
  nodes.forEach(n=>{if(n.x+n.r*3<x0||n.x-n.r*3>x1||n.y+n.r*3<y0||n.y-n.r*3>y1)return;
    const off=n.r+(s>.85?n.levels*9.5+24:16/s);
    label(n.name,n.x,n.y+off,13,sans,'#ebe9e4',dl,500,false);
    if(s>.9)label(n.doneN+' of '+n.L+' lessons',n.x,n.y+off+16/s,11,sans,'#8d9099',ramp(s,.9,1.2),400,false)});
  const cn=1-ramp(s,.55,.95),fs=clamp(W/13,24,36);
  clusters.forEach(c=>label(c.g.name,c.x,c.y,fs,serif,c.g.color,cn,400,true));
  // far hint labels for tiny maps
  ctx.setTransform(dpr,0,0,dpr,0,0)}

/* ---------- interaction ---------- */
const ptr=new Map();let moved=false,down=null,pinch=null,lastMove=0,hintGone=false;
const toWorld=(x,y)=>[(x-cam.x)/cam.s,(y-cam.y)/cam.s];
function hideHint(){if(hintGone)return;hintGone=true;document.getElementById('hint').classList.add('gone')}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect();ptr.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});fly=null;zt=null;vel=null;hideHint();
  if(ptr.size===1){moved=false;down={x:e.clientX-r.left,y:e.clientY-r.top,t:performance.now()};lastMove=performance.now()}
  if(ptr.size===2){moved=true;const[a,b]=[...ptr.values()];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,s:cam.s,w:toWorld(mx,my)}}
  cv.classList.add('drag')});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(ptr.size===1){const dx=x-p.x,dy=y-p.y;if(!moved&&Math.hypot(x-down.x,y-down.y)>6)moved=true;if(moved){cam.x+=dx;cam.y+=dy;const now=performance.now(),dt=Math.max(1,now-lastMove);lastMove=now;vel=vel||{x:0,y:0};vel.x=vel.x*.6+dx/dt*.4;vel.y=vel.y*.6+dy/dt*.4;clampCam();request()}}
  else if(ptr.size===2&&pinch){p.x=x;p.y=y;const[a,b]=[...ptr.values()];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,d=Math.hypot(a.x-b.x,a.y-b.y)||1;const ns=clamp(pinch.s*d/pinch.d,minS()*.9,MAXS);cam.s=ns;cam.x=mx-pinch.w[0]*ns;cam.y=my-pinch.w[1]*ns;vel=null;request()}
  p.x=x;p.y=y});
function endPtr(e){const had=ptr.delete(e.pointerId);if(!had)return;
  if(ptr.size<2)pinch=null;
  if(ptr.size===0){cv.classList.remove('drag');const r=cv.getBoundingClientRect();
    if(!moved&&down&&performance.now()-down.t<500)tap(down.x,down.y);
    else if(vel&&performance.now()-lastMove<90&&Math.hypot(vel.x,vel.y)>.05)request();else vel=null;
    if(cam.s<minS()){zt={s:minS(),ax:W/2,ay:H/2,wx:(W/2-cam.x)/cam.s,wy:(H/2-cam.y)/cam.s};request()}}}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();hideHint();fly=null;vel=null;const r=cv.getBoundingClientRect(),ax=e.clientX-r.left,ay=e.clientY-r.top;
  let dy=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?400:1);const f=Math.exp(-dy*(e.ctrlKey?.01:.0017));
  const base=zt?zt.s:cam.s,ns=clamp(base*f,minS(),MAXS),w=toWorld(ax,ay);zt={s:ns,ax,ay,wx:w[0],wy:w[1]};request()},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
cv.addEventListener('keydown',e=>{const k=e.key,st=60;if(k==='+'||k==='='||k==='-'){const f=k==='-'?.8:1.25;const w=[(W/2-cam.x)/cam.s,(H/2-cam.y)/cam.s];zt={s:clamp((zt?zt.s:cam.s)*f,minS(),MAXS),ax:W/2,ay:H/2,wx:w[0],wy:w[1]};request()}
  else if(k==='ArrowLeft'){cam.x+=st;request()}else if(k==='ArrowRight'){cam.x-=st;request()}else if(k==='ArrowUp'){cam.y+=st;request()}else if(k==='ArrowDown'){cam.y-=st;request()}else return;e.preventDefault()});

/* ---------- tap, selection, sheet ---------- */
const sheet=document.getElementById('sheet');
function tap(x,y){const[wx,wy]=toWorld(x,y);
  {let hit=null,bd=1e9;nodes.forEach(n=>{const d=Math.hypot(n.x-wx,n.y-wy),lim=n.r*1.15+8/cam.s;if(d<lim&&d<bd){bd=d;hit=n}});if(hit){select(hit);return}}
  let cl=null;clusters.forEach(c=>{if(Math.hypot(c.x-wx,c.y-wy)<c.rad*.95)cl=c});
  if(cl&&cam.s<.9){deselect();const f=fitRect(cl.x-cl.rad,cl.y-cl.rad,cl.x+cl.rad,cl.y+cl.rad,10);flyTo(cl.x,cl.y,f.s,f.sy);return}
  deselect()}
function select(n){sel=n;const c=n.c.g;document.getElementById('sn').textContent=n.name;document.getElementById('sg').textContent=c.name;document.getElementById('sd').style.background=c.color;
  document.getElementById('sl').textContent=`${n.doneN} of ${n.L}`;document.getElementById('su').textContent=n.due;document.getElementById('sv').textContent=n.levels;
  const b=document.getElementById('sb');b.style.width=Math.round(n.p*100)+'%';b.style.background=c.color;sheet.hidden=false;
  const sh=sheet.getBoundingClientRect().height||170;const target=Math.max(cam.s,1.5);const sy=Math.max(90,(H-sh-70)/2+10);flyTo(n.x,n.y,target,sy,600);request()}
function deselect(){sel=null;sheet.hidden=true;request()}
document.getElementById('sx').addEventListener('click',deselect);
document.getElementById('fit').addEventListener('click',()=>{deselect();hideHint();fitAll(true)});
let tt=0;const toast=document.getElementById('toast');
document.querySelectorAll('[data-demo]').forEach(b=>b.addEventListener('click',()=>{toast.textContent='Demo only. This button is not wired up in the test.';toast.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toast.hidden=true,1800)}));
toast.hidden=true;

/* ---------- start ---------- */
new ResizeObserver(()=>{const had=W>0,cx=(W/2-cam.x)/cam.s,cy=(H/2-cam.y)/cam.s;size();if(!had){fitAll(false)}else{const old=fitS;const f=fitRect(B.x0,B.y0,B.x1,B.y1,14);fitS=f.s;cam.s=clamp(cam.s*f.s/old,minS(),MAXS);cam.x=W/2-cx*cam.s;cam.y=H/2-cy*cam.s;request()}}).observe(cv);
if(document.fonts){['italic 400 24px Newsreader','500 14px "Instrument Sans"','400 12px "Instrument Sans"'].forEach(f=>document.fonts.load(f).then(request).catch(()=>{}))}
window.__map={cam,nodes,clusters,get fitS(){return fitS},get fly(){return fly},get zt(){return zt},get vel(){return vel}};
})();
</script>
