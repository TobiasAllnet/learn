<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rate topics</title>
<style>
:root{--bg:#0f1220;--card:#181c30;--card2:#20253d;--text:#eef0fa;--mute:#98a0c3;--accent:#7c6cf0;--bad:#ef5b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
#w{max-width:560px;margin:0 auto;padding:18px 14px 120px}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--mute);font-size:14px;margin:0 0 6px;line-height:1.4}
h3{font-size:13px;color:var(--mute);margin:22px 0 4px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.r{background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px}
.r b{font-size:16px}.r small{display:block;color:var(--mute);font-size:12px;margin:2px 0 10px}
.p{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.p button{height:44px;border:0;border-radius:10px;background:var(--card2);color:var(--text);font:inherit;font-size:16px;cursor:pointer}
.p button.on{background:var(--accent);font-weight:700}
.p button.z.on{background:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.bar button{display:block;width:100%;max-width:560px;margin:0 auto;height:52px;border:0;border-radius:14px;background:var(--accent);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
#out{display:none;margin-top:16px;background:var(--card);border-radius:14px;padding:12px;font-size:13px;color:var(--mute);word-break:break-word}
</style>
</head>
<body>
<div id="w">
<h1>Rate your focus</h1>
<p class="sub">0 = skip it, 1 = short overview, 3 = normal, 5 = I want to know this really well. Everything starts at 3, so change only what matters.</p>
<div id="list"></div>
<div id="out"></div>
</div>
<div class="bar"><button id="copy">Copy my ratings</button></div>
<script>
const G=[
["Brands: security and networking",[["Stormshield","European firewalls, IT and OT"],["Ubiquiti","UniFi networking, cameras, access"],["TP-Link Omada","Business Wi-Fi and switching"],["Aginet","TP-Link operator line, fibre CPE"],["Zyxel","Networking, LTE routers"],["Teltonika","Industrial routers"],["Cudy","Budget routers, 4G and 5G"]]],
["Brands: smart home, audio, other",[["Shelly","Smart relays, energy meters"],["Aqara","Smart home sensors"],["Shokz","Open-ear headsets"],["Yealink","VoIP phones, video meetings"],["Insta360","Action and 360 cameras"],["Allnet own line","Cables, racks, switches"],["Webmercs and Netset","Reseller ordering platforms"]]],
["Base topics",[["Network basics","LAN, WAN, IP, DNS, Wi-Fi standards"],["Firewalls and security","NGFW, VPN, zones"],["Switches and PoE","Managed switching, power over Ethernet"],["Wi-Fi and access points","Coverage, Wi-Fi 6 and 7"],["Surveillance and cameras","IP cameras, NVR, access control"],["Mobile broadband","4G and 5G routers, SIM"],["IT versus OT","Office versus industrial networks"],["Licensing and support","Subscriptions, warranties"]]],
["Life and productivity topics",[["AI and prompting","Using AI well at work"],["Basic programming","Python or similar, concepts"],["Productivity and Excel","Tools, shortcuts, habits"]]]
];
const KEY="rate.v1";let v={};try{v=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const L=document.getElementById("list");
G.forEach(([t,items])=>{const h=document.createElement("h3");h.textContent=t;L.appendChild(h);
 items.forEach(([n,d])=>{if(v[n]==null)v[n]=3;const r=document.createElement("div");r.className="r";
  r.innerHTML="<b>"+n+"</b><small>"+d+"</small><div class='p'></div>";const p=r.querySelector(".p");
  for(let i=0;i<=5;i++){const b=document.createElement("button");b.textContent=i;if(i===0)b.className="z";if(v[n]===i)b.classList.add("on");
   b.onclick=()=>{v[n]=i;p.querySelectorAll("button").forEach((x,k)=>x.classList.toggle("on",k===i));try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}};p.appendChild(b)}
  L.appendChild(r)})});
document.getElementById("copy").onclick=async()=>{
 const txt="My ratings (0 skip to 5 top focus): "+Object.entries(v).map(([k,x])=>k+"="+x).join(", ");
 const o=document.getElementById("out");o.style.display="block";o.textContent=txt;
 try{await navigator.clipboard.writeText(txt);document.getElementById("copy").textContent="Copied. Paste it to Claude."}catch(e){document.getElementById("copy").textContent="Select the text below and copy it";}
};
</script>
</body>
</html>
